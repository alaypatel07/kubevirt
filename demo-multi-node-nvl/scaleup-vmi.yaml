apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: imex-vm-03
  labels:
    app: imex-pair
spec:
  hostname: imex-vm-03
  subdomain: imex-service
  domain:
    devices:
      disks:
      - disk:
          bus: virtio
        name: containerdisk
      - disk:
          bus: virtio
        name: cloudinitdisk
    resources:
      requests:
        memory: 5120M
  terminationGracePeriodSeconds: 0
  volumes:
  - containerDisk:
      image: quay.io/containerdisks/fedora
    name: containerdisk
  - cloudInitNoCloud:
      secretRef:
        name: imex-cloudinit
    name: cloudinitdisk
