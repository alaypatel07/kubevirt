---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  labels:
    special: vmi-systemd-service
  name: vmi-systemd-service
spec:
  domain:
    devices:
      disks:
      - disk:
          bus: virtio
        name: containerdisk
      - disk:
          bus: virtio
        name: cloudinitdisk
      interfaces:
      - masquerade: {}
        name: default
      rng: {}
    memory:
      guest: 1024M
    resources: {}
  networks:
  - name: default
    pod: {}
  terminationGracePeriodSeconds: 0
  volumes:
  - containerDisk:
      image: registry:5000/kubevirt/fedora-with-test-tooling-container-disk:devel
    name: containerdisk
  - cloudInitNoCloud:
      userData: |-
        #cloud-config
        password: fedora
        chpasswd: { expire: False }

        # Create a custom systemd service unit file
        write_files:
          - path: /etc/systemd/system/my-custom.service
            content: |
              [Unit]
              Description=My Custom Service
              After=network.target

              [Service]
              Type=simple
              ExecStart=/usr/local/bin/my-custom-script.sh
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
          - path: /usr/local/bin/my-custom-script.sh
            permissions: '0755'
            content: |
              #!/bin/bash
              while true; do
                echo "Custom service running at $(date)" >> /var/log/my-custom.log
                sleep 60
              done

        # Enable and start the service after boot
        runcmd:
          - [ "systemctl", "daemon-reload" ]
          - [ "systemctl", "enable", "--now", "my-custom.service" ]
    name: cloudinitdisk
