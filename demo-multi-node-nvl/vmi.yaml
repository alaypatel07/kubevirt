---
apiVersion: v1
kind: ConfigMap
metadata:
  name: imex-nodes-config
data:
  nodes_config.cfg: |
    imex-vm-01.imex-service.default.svc.cluster.local
    imex-vm-02.imex-service.default.svc.cluster.local
    imex-vm-03.imex-service.default.svc.cluster.local
    imex-vm-04.imex-service.default.svc.cluster.local
    imex-vm-05.imex-service.default.svc.cluster.local
---
apiVersion: v1
kind: Secret
metadata:
  name: imex-cloudinit
type: Opaque
stringData:
  userdata: |
    #cloud-config
    password: fedora
    chpasswd: { expire: False }
    write_files:
      - path: /etc/yum.repos.d/cuda-rhel9.repo
        permissions: '0644'
        content: |
          [cuda-rhel9-x86_64]
          name=cuda-rhel9-x86_64
          baseurl=https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64
          enabled=1
          gpgcheck=1
          gpgkey=https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/D42D0685.pub
      - path: /etc/systemd/system/nvidia-imex.service
        permissions: '0644'
        content: |
          [Unit]
          Description=NVIDIA IMEX Daemon
          After=network-online.target setup-imex.service
          Wants=network-online.target
          Requires=setup-imex.service

          [Service]
          Type=forking
          ExecStart=/usr/bin/nvidia-imex --nogpu
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      - path: /etc/systemd/system/setup-imex.service
        permissions: '0644'
        content: |
          [Unit]
          Description=Install NVIDIA IMEX
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=!/usr/bin/nvidia-imex

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/dnf install -y nvidia-imex
          RemainAfterExit=true

          [Install]
          WantedBy=multi-user.target
    runcmd:
      - mkdir -p /etc/nvidia-imex
      - mkdir -p /mnt/imex-config
      - mount -t virtiofs imex-nodes-config /mnt/imex-config
      - ln -sf /mnt/imex-config/nodes_config.cfg /etc/nvidia-imex/nodes_config.cfg
      - systemctl daemon-reload
      - systemctl enable --now setup-imex.service
      - systemctl enable --now nvidia-imex.service
---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: imex-vm-01
  labels:
    app: imex-pair
spec:
  hostname: imex-vm-01
  subdomain: imex-service
  domain:
    devices:
      disks:
      - disk:
          bus: virtio
        name: containerdisk
      - disk:
          bus: virtio
        name: cloudinitdisk
      filesystems:
      - name: imex-nodes-config
        virtiofs: {}
    resources:
      requests:
        memory: 5120M
  terminationGracePeriodSeconds: 0
  volumes:
  - containerDisk:
      image: quay.io/containerdisks/fedora
    name: containerdisk
  - cloudInitNoCloud:
      secretRef:
        name: imex-cloudinit
    name: cloudinitdisk
  - configMap:
      name: imex-nodes-config
    name: imex-nodes-config
---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: imex-vm-02
  labels:
    app: imex-pair
spec:
  hostname: imex-vm-02
  subdomain: imex-service
  domain:
    devices:
      disks:
      - disk:
          bus: virtio
        name: containerdisk
      - disk:
          bus: virtio
        name: cloudinitdisk
      filesystems:
      - name: imex-nodes-config
        virtiofs: {}
    resources:
      requests:
        memory: 5120M
  terminationGracePeriodSeconds: 0
  volumes:
  - containerDisk:
      image: quay.io/containerdisks/fedora
    name: containerdisk
  - cloudInitNoCloud:
      secretRef:
        name: imex-cloudinit
    name: cloudinitdisk
  - configMap:
      name: imex-nodes-config
    name: imex-nodes-config
---
apiVersion: v1
kind: Service
metadata:
  name: imex-service
spec:
  clusterIP: None
  selector:
    app: imex-pair
  ports:
  - name: imex-peer
    port: 50000
    targetPort: 50000
    protocol: TCP
  - name: imex-cmd
    port: 50005
    targetPort: 50005
    protocol: TCP
  - name: ssh
    port: 22
    targetPort: 22
    protocol: TCP
