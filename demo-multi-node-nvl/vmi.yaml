---
apiVersion: v1
kind: Secret
metadata:
  name: imex-cloudinit
type: Opaque
stringData:
  userdata: |
    #cloud-config
    password: fedora
    chpasswd: { expire: False }
    write_files:
      - path: /etc/yum.repos.d/cuda-rhel9.repo
        permissions: '0644'
        content: |
          [cuda-rhel9-x86_64]
          name=cuda-rhel9-x86_64
          baseurl=https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64
          enabled=1
          gpgcheck=1
          gpgkey=https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/D42D0685.pub
      - path: /etc/nvidia-imex/nodes_config.cfg
        permissions: '0644'
        content: |
          imex-vm-01.imex-service.default.svc.cluster.local
          imex-vm-02.imex-service.default.svc.cluster.local
          imex-vm-03.imex-service.default.svc.cluster.local
          imex-vm-04.imex-service.default.svc.cluster.local
          imex-vm-05.imex-service.default.svc.cluster.local
      - path: /etc/nvidia-imex/config.cfg
        permissions: '0644'
        content: |
          LOG_LEVEL=4
          LOG_FILE_NAME=/var/log/nvidia-imex.log
          LOG_APPEND_TO_LOG=1
          LOG_FILE_MAX_SIZE=1024
          LOG_MAX_ROTATE_COUNT=10
          LOG_USE_SYSLOG=0
          DAEMONIZE=0
          BIND_INTERFACE_IP=
          SERVER_PORT=50000
          IMEX_NODE_CONFIG_FILE=/etc/nvidia-imex/nodes_config.cfg
          NETWORK_INTERFACE=
          IMEX_WAIT_FOR_QUORUM=NONE
          IMEX_ENABLE_AUTH_ENCRYPTION=0
          IMEX_CMD_ENABLED=1
          IMEX_CMD_BIND_INTERFACE_IP=
          IMEX_CMD_PORT=50005
          IMEX_CMD_UNIX_DOMAIN_PATH=
          IMEX_NODE_DISCONNECTED_GRACE_TIME=-1
      - path: /etc/systemd/system/nvidia-imex.service
        permissions: '0644'
        content: |
          [Unit]
          Description=NVIDIA IMEX Daemon
          After=network-online.target setup-imex.service
          Wants=network-online.target
          Requires=setup-imex.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/nvidia-imex -c /etc/nvidia-imex/config.cfg --nogpu
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      - path: /etc/systemd/system/setup-imex.service
        permissions: '0644'
        content: |
          [Unit]
          Description=Install NVIDIA IMEX
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=!/usr/bin/nvidia-imex

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/dnf install -y nvidia-imex
          RemainAfterExit=true

          [Install]
          WantedBy=multi-user.target
    runcmd:
      - mkdir -p /etc/nvidia-imex
      - systemctl daemon-reload
      - systemctl enable --now setup-imex.service
      - systemctl enable --now nvidia-imex.service
---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: imex-vm-01
  labels:
    app: imex-pair
spec:
  hostname: imex-vm-01
  subdomain: imex-service
  domain:
    devices:
      disks:
      - disk:
          bus: virtio
        name: containerdisk
      - disk:
          bus: virtio
        name: cloudinitdisk
    resources:
      requests:
        memory: 5120M
  terminationGracePeriodSeconds: 0
  volumes:
  - containerDisk:
      image: quay.io/containerdisks/fedora
    name: containerdisk
  - cloudInitNoCloud:
      secretRef:
        name: imex-cloudinit
    name: cloudinitdisk
---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: imex-vm-02
  labels:
    app: imex-pair
spec:
  hostname: imex-vm-02
  subdomain: imex-service
  domain:
    devices:
      disks:
      - disk:
          bus: virtio
        name: containerdisk
      - disk:
          bus: virtio
        name: cloudinitdisk
    resources:
      requests:
        memory: 5120M
  terminationGracePeriodSeconds: 0
  volumes:
  - containerDisk:
      image: quay.io/containerdisks/fedora
    name: containerdisk
  - cloudInitNoCloud:
      secretRef:
        name: imex-cloudinit
    name: cloudinitdisk
---
apiVersion: v1
kind: Service
metadata:
  name: imex-service
spec:
  clusterIP: None
  selector:
    app: imex-pair
  ports:
  - name: imex-peer
    port: 50000
    targetPort: 50000
    protocol: TCP
  - name: imex-cmd
    port: 50005
    targetPort: 50005
    protocol: TCP
  - name: ssh
    port: 22
    targetPort: 22
    protocol: TCP
