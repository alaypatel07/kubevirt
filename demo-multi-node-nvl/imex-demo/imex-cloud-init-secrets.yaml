---
# Shared cloud-init userdata for IMEX VMs
# Both imex-vm-1 and imex-vm-2 use this same secret
apiVersion: v1
kind: Secret
metadata:
  name: imex-cloudinit
type: Opaque
stringData:
  userdata: |
    #cloud-config
    password: fedora
    chpasswd: { expire: False }
    manage_resolv_conf: true
    resolv_conf:
      nameservers: ['10.96.0.10']
      searchdomains: ['default.svc.cluster.local','svc.cluster.local','cluster.local']
    write_files:
      - path: /etc/NetworkManager/dispatcher.d/99-fix-route
        permissions: '0755'
        content: |
          #!/bin/bash
          IFACE=$(ip route|grep ^default|awk '{print $5}')
          CIDR=$(ip route|grep "proto kernel"|grep "$IFACE"|awk '{print $1}')
          [ -n "$CIDR" ] && ip route del "$CIDR" dev "$IFACE" 2>/dev/null||true
      - path: /etc/yum.repos.d/cuda-rhel9.repo
        permissions: '0644'
        content: |
          [cuda-rhel9-x86_64]
          name=cuda-rhel9-x86_64
          baseurl=https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64
          enabled=1
          gpgcheck=1
          gpgkey=https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/D42D0685.pub
      - path: /etc/systemd/system/nvidia-imex.service.d/nogpu.conf
        permissions: '0644'
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/nvidia-imex -c /etc/nvidia-imex/config.cfg --nogpu
      - path: /usr/local/bin/setup-imex.sh
        permissions: '0755'
        content: |
          #!/bin/bash
          set -e
          LOG=/var/log/imex-setup.log
          echo "$(date): Starting IMEX setup" >> $LOG

          # Install nvidia-imex package
          echo "$(date): Installing nvidia-imex..." >> $LOG
          dnf install -y nvidia-imex >> $LOG 2>&1

          # Create IMEX config directory
          mkdir -p /etc/nvidia-imex

          # Mount virtiofs for dynamic nodes config
          echo "$(date): Mounting virtiofs for nodes config..." >> $LOG
          mkdir -p /mnt/imex-config
          mount -t virtiofs imex-config /mnt/imex-config >> $LOG 2>&1 || echo "virtiofs mount failed, using static config" >> $LOG

          # Symlink the nodes config from virtiofs mount
          if [ -f /mnt/imex-config/nodes_config.cfg ]; then
            ln -sf /mnt/imex-config/nodes_config.cfg /etc/nvidia-imex/nodes_config.cfg
            echo "$(date): Linked nodes_config.cfg from virtiofs" >> $LOG
          else
            echo "$(date): WARNING: virtiofs nodes_config.cfg not found" >> $LOG
          fi

          # Ensure override directory exists
          mkdir -p /etc/systemd/system/nvidia-imex.service.d

          # Reload systemd to pick up the override
          systemctl daemon-reload

          # Enable and start nvidia-imex service
          echo "$(date): Starting nvidia-imex service..." >> $LOG
          systemctl enable --now nvidia-imex.service >> $LOG 2>&1

          echo "$(date): IMEX setup complete" >> $LOG
      - path: /etc/systemd/system/mnt-imex\\x2dconfig.mount
        permissions: '0644'
        content: |
          [Unit]
          Description=Mount virtiofs imex-config
          After=local-fs.target

          [Mount]
          What=imex-config
          Where=/mnt/imex-config
          Type=virtiofs

          [Install]
          WantedBy=multi-user.target
    runcmd:
      - chmod +x /etc/NetworkManager/dispatcher.d/99-fix-route
      - /etc/NetworkManager/dispatcher.d/99-fix-route
      - mkdir -p /etc/nvidia-imex
      - mkdir -p /etc/systemd/system/nvidia-imex.service.d
      - /usr/local/bin/setup-imex.sh
