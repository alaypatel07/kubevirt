---
# VM-1: Discovers and pings vm-2 via headless service DNS
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: vm-1
  labels:
    app: vm-pair
  annotations:
    hooks.kubevirt.io/hookSidecars: '[{"args": ["--version", "v1alpha2"],
      "image": "registry:5000/kubevirt/systemd-service-sidecar:latest"}]'
    kubevirt.io/start-services: "vm-discovery.service"
spec:
  hostname: vm-1
  subdomain: my-service
  domain:
    devices:
      disks:
      - disk:
          bus: virtio
        name: containerdisk
      - disk:
          bus: virtio
        name: cloudinitdisk
      interfaces:
      - bridge: {}
        name: default
      rng: {}
    memory:
      guest: 1024M
    resources: {}
  networks:
  - name: default
    pod: {}
  terminationGracePeriodSeconds: 0
  volumes:
  - containerDisk:
      image: quay.io/containerdisks/fedora
    name: containerdisk
  - cloudInitNoCloud:
      userData: |-
        #cloud-config
        password: fedora
        chpasswd: { expire: False }

        # Use Kubernetes DNS (ClusterIP)
        # NOTE: Update this IP to your cluster's kube-dns ClusterIP
        # Find it with: kubectl get svc -n kube-system kube-dns -o jsonpath='{.spec.clusterIP}'
        # Common values: 10.96.0.10 (default), 10.64.0.10 (some Kind clusters)
        manage_resolv_conf: true
        resolv_conf:
          nameservers:
            - 10.96.0.10
          searchdomains:
            - default.svc.cluster.local
            - svc.cluster.local
            - cluster.local

        # Fix routing for kindnet point-to-point networking
        # NetworkManager dispatcher script removes the /24 local route on every network up event
        runcmd:
          - chmod +x /etc/NetworkManager/dispatcher.d/99-fix-kindnet-route
          - /etc/NetworkManager/dispatcher.d/99-fix-kindnet-route

        write_files:
          - path: /etc/NetworkManager/dispatcher.d/99-fix-kindnet-route
            permissions: '0755'
            content: |
              #!/bin/bash
              # Fix for kindnet point-to-point networking
              # KubeVirt DHCP gives /24 netmask which adds a local route that breaks pod-to-pod routing
              IFACE=$(ip route | grep "^default" | awk '{print $5}')
              CIDR=$(ip route | grep "proto kernel" | grep "$IFACE" | awk '{print $1}')
              if [ -n "$CIDR" ]; then
                ip route del "$CIDR" dev "$IFACE" 2>/dev/null || true
              fi

          - path: /etc/systemd/system/vm-discovery.service
            content: |
              [Unit]
              Description=VM Discovery Service - Ping vm-2
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=simple
              ExecStart=/usr/local/bin/vm-discovery.sh
              Restart=always
              RestartSec=10

              [Install]
              WantedBy=multi-user.target

          - path: /usr/local/bin/vm-discovery.sh
            permissions: '0755'
            content: |
              #!/bin/bash
              TARGET="vm-2.my-service.default.svc.cluster.local"
              LOG="/var/log/vm-discovery.log"
              echo "Starting VM discovery service - target: $TARGET" >> $LOG
              while true; do
                if ping -c 1 -W 2 $TARGET > /dev/null 2>&1; then
                  echo "$(date): $TARGET is REACHABLE" >> $LOG
                else
                  echo "$(date): $TARGET is UNREACHABLE" >> $LOG
                fi
                sleep 30
              done
    name: cloudinitdisk
---
