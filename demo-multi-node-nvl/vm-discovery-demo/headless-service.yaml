---
# Headless Service for VM DNS discovery
# This enables VMs to discover each other using DNS names:
#   vm-1.my-service.<namespace>.svc.cluster.local
#   vm-2.my-service.<namespace>.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  clusterIP: None  # Headless service
  selector:
    app: vm-pair
  ports:
    - port: 22
      name: ssh
